syntax = "proto3";

package invite_service;

import "services/authservice/authservice.proto";

//service inviteServiceDataHandler {
//  rpc get_invites_received(authservice.UserPreview) returns (InvitesReceive);
//}

enum InviteStatus {
  SENT = 0;
  ACCEPTED = 1;
  DECLINED = 2;
}

message Invite {
  uint32 invite_id = 1;
  authservice.UserPreview sender = 2;
  string invite_text = 3;
  InviteStatus status = 4;
}

message InvitesReceive {
  repeated Invite invites = 1;
}

message InvitesSent {
  repeated Invite invites = 1;
}