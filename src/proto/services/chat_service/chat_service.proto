syntax = "proto3";

package chat_service;

import "common/common.proto";

enum Status {
    SUCCESS = 0;
    ERROR = 1;
}

enum UserPrivilege {
    ADMIN = 0;
    DEFAULT = 1;
}

service ChatHandler {
    rpc HandleChat(stream ChatRequests) returns (stream ChatResponses);
    rpc CreatePrivateChat(CreatePrivateChatRequest) returns (ChatPreview);
    rpc CreateGroupChat(CreateGroupChatRequest) returns (ChatPreview);
    rpc CheckUserPrivileges(CheckUserPrivilegesRequest) returns (UserPrivilegeResponse);
    rpc ChangeChatName(ChangeChatNameRequest) returns (ChangeChatNameResponse);
    rpc ChangeChatDescription(ChangeChatDescriptionRequest) returns (ChangeChatDescriptionResponse);
    rpc ChangeChatCover(ChangeChatCoverRequest) returns (ChangeChatCoverResponse);
    rpc AddPrivilegesToUser(AddPrivilegesToUserRequest) returns (AddPrivilegesToUserResponse);
    rpc RemovePrivilegesFromUser(RemovePrivilegesFromUserRequest) returns (RemovePrivilegesFromUserResponse);
}

// static void add_user_to_chat(const int &chat_id, const int &user_id);
// static void remove_user_from_chat(const int &chat_id, const int &user_id);

service ChatDataService {
    rpc GetUserChats(GetChatsRequest) returns (UserChats);
    rpc GetLastMessages(GetChatMessagesRequest) returns (LastMessages);
}

message ChatRequests {
    oneof request {
        InitialRequest init = 1;
        SendMessageRequest send_message = 2;
        DisconnectRequest leave = 3;
    }

}

message ChatResponses {
    oneof response {
        OperationStatusResponse response_with_status = 1;
        AcceptMessageResponse accept_message = 2;
    }
}

message InitialRequest {
    int32 user_id = 1;
}
message DisconnectRequest {
    int32 user_id = 1;
}

message SendMessageRequest {
    MessageSend msg = 1;
}

message OperationStatusResponse {
    Status status = 1;
}

message AcceptMessageResponse {
    MessageReceived msg = 1;
}

message MessageSend {
    int32 sender_id = 1;
    int32  chat_id = 2;
    string message_text = 3;
};

message MessageReceived {
    common.UserPreview sender = 1;
    int32 chat_id = 2;
    string message_text = 3;
    string time_stamp = 4;
}

message ChatPreview {
  uint32 chat_id = 1;
  bool is_group_chat = 2;
  optional string name = 3;
  optional string description = 4;
  string time_stamp = 5;
  MessageReceived last_message = 6;
  repeated common.UserPreview chat_members = 7;
  optional bytes chat_cover = 8;
}

message GetChatsRequest {
    int32 user_id = 1;
}

message GetChatMessagesRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message UserChats {
  repeated ChatPreview user_chats = 1;
}

message LastMessages {
  repeated MessageReceived messages = 1;
}

message CreatePrivateChatRequest {
    int32 firest_user_id = 1;
    int32 second_user_id = 2;
}

message CreateGroupChatRequest {
    int32 creator_id = 1;
    string chat_name = 2;
    string description = 3;
    repeated int32 chat_members = 4;
}

message CheckUserPrivilegesRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message UserPrivilegeResponse {
    UserPrivilege privilege = 1;
}

message ChangeChatNameRequest {
    int32 chat_id = 1;
    string new_chat_name = 2;
}

message ChangeChatNameResponse {

}

message ChangeChatDescriptionRequest {
    int32 chat_id = 1;
    string new_description = 2;
}

message ChangeChatDescriptionResponse {

}

message ChangeChatCoverRequest {
    int32 chat_id = 1;
    bytes new_cover = 2;
}

message ChangeChatCoverResponse {

}

message AddPrivilegesToUserRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message AddPrivilegesToUserResponse {

}

message RemovePrivilegesFromUserRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message RemovePrivilegesFromUserResponse {

}