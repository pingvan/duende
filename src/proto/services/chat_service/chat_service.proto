syntax = "proto3";

package chat_service;

//import "services/authservice/authservice.proto";

import "common/common.proto";

enum Status {
    SUCCESS = 0;
    ERROR = 1;
}

//TODO::make one service not to hold many connections 

service ChatHandler {
    rpc HandleChat(stream ChatRequests) returns (stream ChatResponses);
}

service ChatDataService {
    rpc GetUserChats(GetChatsRequest) returns (UserChats);
    rpc GetLastMessages(GetChatMessagesRequest) returns (LastMessages);
}

message ChatRequests {
    oneof request {
        InitialRequest init = 1;
        SendMessageRequest send_message = 2;
        DisconnectRequest leave = 3;
    }

}

message ChatResponses {
    oneof response {
        OperationStatusResponse response_with_status = 1;
        AcceptMessageResponse accept_message = 2;
    }
}

message InitialRequest {
    int32 user_id = 1;
}
message DisconnectRequest {
    int32 user_id = 1;
}

message SendMessageRequest {
    MessageSend msg = 1;
}

message OperationStatusResposne {
    Status status = 1;
}

message AcceptMessageResponse {
    Message msg = 1;
}

message MessageSend {
    int32 sender_id = 1;
    int32  chat_id = 2;
    string timestamp_ = 3;
    string message_text = 4;
};

message MessageReceived {
  string message_text = 1;
  common.UserPreview sender = 2;
  string time_stamp = 3;
}

message ChatPreview {
  uint32 chat_id = 1;
  string name = 2;
  string description = 3;
  string time_stamp = 4;
  MessageReceived last_message = 5;
}

message GetChatsRequest {
    int32 user_id = 1;
}

message GetChatMessagesRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message UserChats {
  repeated ChatPreview user_chats = 1;
}

message LastMessages {
  repeated MessageData messages = 1;
}