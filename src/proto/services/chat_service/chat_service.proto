syntax = "proto3";

package chat_service;

import "common/common.proto";

enum Status {
    SUCCESS = 0;
    ERROR = 1;
}

enum UserPrivilege {
    ADMIN = 0;
    DEFAULT = 1;
}

enum InviteStatus {
    ACCEPT = 0;
    DECLINED = 1;
}

enum EventType {
    NAME_CHANGED = 0;
    DESCRIPTION_CHANGED = 1;
    COVER_CHANGED = 2;
    USER_ENTERED = 3;
    USER_LEFT = 4;
    USER_REMOVED = 5;
}

service ChatHandler {
    rpc HandleChat(stream ChatRequests) returns (stream ChatResponses);
    rpc InvitesToChat(stream InvitesToChatRequests) returns (stream InvitesToChatResponses);
    rpc CreatePrivateChat(CreatePrivateChatRequest) returns (ChatPreview);
    rpc CreateGroupChat(CreateGroupChatRequest) returns (ChatPreview);
    rpc CheckUserPrivileges(UserChat) returns (UserPrivilegeResponse);
    rpc ChangeChatName(ChangeChatNameRequest) returns (OperationStatusResponse);
    rpc ChangeChatDescription(ChangeChatDescriptionRequest) returns (OperationStatusResponse);
    rpc ChangeChatCover(ChangeChatCoverRequest) returns (OperationStatusResponse);
    rpc AddPrivilegesToUser(UserChat) returns (OperationStatusResponse);
    rpc RemovePrivilegesFromUser(UserChat) returns (OperationStatusResponse);
    rpc AddUserToChat(UserChat) returns (OperationStatusResponse);
}

service ChatDataService {
    rpc GetUserChats(GetChatsRequest) returns (UserChats);
    rpc GetLastMessages(GetChatMessagesRequest) returns (LastMessages);
    rpc GetChatMembers(UserChat) returns (GetChatMembersResponse);
    rpc CheckUserInChat(UserChat) returns (BoolResponse);
}

message ChatRequests {
    oneof request {
        InitialRequest init = 1;
        SendMessageRequest send_message = 2;
        DisconnectRequest leave = 3;
    }

}

message ChatResponses {
    oneof response {
        OperationStatusResponse response_with_status = 1;
        AcceptMessageResponse accept_message = 2;
    }
}

message InitialRequest {
    int32 user_id = 1;
}
message DisconnectRequest {
    int32 user_id = 1;
}

message SendMessageRequest {
    MessageSend msg = 1;
}

message OperationStatusResponse {
    Status status = 1;
}

message AcceptMessageResponse {
    MessageReceived msg = 1;
}

message MessageSend {
    int32 sender_id = 1;
    int32  chat_id = 2;
    string message_text = 3;
};

message MessageReceived {
    common.UserPreview sender = 1;
    int32 chat_id = 2;
    string message_text = 3;
    string time_stamp = 4;
}

message ChatPreview {
  uint32 chat_id = 1;
  bool is_group_chat = 2;
  optional string name = 3;
  optional string description = 4;
  string time_stamp = 5;
  MessageReceived last_message = 6;
  repeated common.UserPreview chat_members = 7;
  optional bytes chat_cover = 8;
}

message GetChatsRequest {
    int32 user_id = 1;
}

message GetChatMessagesRequest {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message UserChats {
  repeated ChatPreview user_chats = 1;
}

message LastMessages {
  repeated MessageReceived messages = 1;
}

message CreatePrivateChatRequest {
    int32 firest_user_id = 1;
    int32 second_user_id = 2;
}


message UserChat {
    int32 user_id = 1;
    int32 chat_id = 2;
}

message CreateGroupChatRequest {
    int32 creator_id = 1;
    string chat_name = 2;
    string description = 3;
}

message UserPrivilegeResponse {
    UserPrivilege privilege = 1;
}

message ChangeChatNameRequest {
    int32 chat_id = 1;
    string new_chat_name = 2;
}

message ChangeChatDescriptionRequest {
    int32 chat_id = 1;
    string new_description = 2;
}

message ChangeChatCoverRequest {
    int32 chat_id = 1;
    bytes new_cover = 2;
}

message InvitesToChatRequests {
    oneof request {
        InitialRequest init = 1;
        RemoveRequest remove = 3;
        DisconnectRequest leave = 5;
    }
}

message InvitesToChatResponses {
    oneof response {
        OperationStatusResponse response_with_status = 1;
        RemoveResponse remove = 3;
    }
}

message RemoveRequest {
    int32 sender_id = 1;
    int32 receiver_id = 2;
    int32 chat_id = 3;
}

message RemoveResponse {
    common.UserPreview sender = 1;
    common.UserPreview receiver = 2;
    int32 chat_id = 3;
}

message GetChatMembersResponse {
    repeated common.UserPreview members = 1;
}

message BoolResponse {
    bool response = 1;
}

message ChatEvent {
    EventType event_type = 1;
    optional common.UserPreview user = 2;
    string time_stamp = 3;
    optional common.UserPreview user_affected = 4;
}

message ChatEvents {
    repeated ChatEvent events = 1;
}