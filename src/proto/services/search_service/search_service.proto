syntax = "proto3";

package search_service;

import "common/common.proto";

service SerachService {
    rpc SearchUserByCredentials(UserSearchRequest)
        returns (UserSearchResponse) {
    }
    rpc SearchFilmByTitle(FilmSearchRequest) returns (FilmSearchResponse) {
    }
    rpc SearchActorByName(ActorSearchRequest) returns (ActorSearchResponse) {
    }
}

message UserSearchRequest {
    string user_credentials = 1;
}

message FilmSearchRequest {
    string film_title = 1;
}

message ActorSearchRequest {
    string actor_name = 1;
}

message UserSearchResponse {
    repeated common.UserPreview users = 1;
}

message FilmSearchResponse {
    repeated common.FilmPreview films = 1;
}

message ActorSearchResponse {
    repeated common.ActorPreview actors = 1;
}
