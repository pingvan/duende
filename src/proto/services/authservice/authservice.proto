syntax = "proto3";

package authservice;

message User {
    string username = 1;
    string email = 2;
    int32 id = 3;
    string hashed_password = 4;
    string salt = 5;
};

message Payload {
    int32 user_id = 1;
    string email = 2;
    string username = 3;
}

message AccessToken {
    string token = 1;
};

message RefreshToken {
    string token = 1;
};

message Tokens {
    AccessToken access = 1;
    RefreshToken refresh = 2;
};

service AuthService {
    rpc Login(LoginRequest) returns (LoginResponse) {
    }
    rpc Signup(SignupRequest) returns (SignupResponse) {
    }
    rpc Logout(LogoutRequest) returns (LogoutResponse) {
    }
}

message LoginRequest {
    oneof login {
        string username = 1;
        string email = 2;
    }
    string password = 3;
};

message LoginResponse {
};

message SignupRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string password_confirmation = 4;
};

message SignupResponse {
    Tokens tokens = 1;
};

message LogoutRequest {
    int32 id = 1;
    RefreshToken token = 2;
};

message LogoutResponse {
};

service AuthServiceData {
    rpc GetUserPrewiew(RequstWithUserId) returns (UserPreview);
    rpc GetUserFullPage(RequstWithUserId) returns (UserFullPage);
};

message RequstWithUserId {
    int32 user_id = 1;
}

enum Genre {
  ACTION = 0;
  ADVENTURE = 1;
  COMEDY = 2;
  DRAMA = 3;
  HORROR = 4;
  SCI_FI = 5;
  FANTASY = 6;
  THRILLER = 7;
  MYSTERY = 8;
  ROMANCE = 9;
  ANIMATION = 10;
  DOCUMENTARY = 11;
  CRIME = 12;
  WESTERN = 13;
  MUSIC = 14;
  HISTORY = 15;
  WAR = 16;
  BIOGRAPHICAL = 17;
  SPORTS = 18;
  FAMILY = 19;
  FOREIGN = 20;
  TV_MOVIE = 21;
}



message ActorPreview {
  string full_name = 1;
}

message FilmPreview {
  string title = 1;
}

message FilmFullPage {
  FilmPreview preview = 1;
  string description = 2;
  repeated Genre genres = 3;
}

message FilmOnUserPage {
  FilmFullPage full_page = 1;
  int32 ratio = 2;
}

message UserPreview {
  string login = 1;
}

message UserFullPage {
  UserPreview preview = 1;
  string quote = 2;
  string about = 3;
  repeated Genre favorite_genres = 4;
  repeated ActorPreview favorite_actors = 5;
  repeated FilmOnUserPage watched_films = 6;
}
