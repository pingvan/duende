syntax = "proto3";

package subscription;

service SubscriptionService {
  rpc SubscriptionStream(stream StreamRequest) returns (stream StreamResponse) {}
}

message Notification {
    int32 subscriber_id = 1;
    int32 subscribie_id = 2;
    string message = 3;
}

message StreamRequest {
  oneof RequestEvent {
    SubscribeRequest subscribe_request = 1;
    UnsubscribeRequest unsubscribe_request = 2;
  }
}

message StreamResponse {
  oneof ResponseEvent {
    SubscribeResponse subscribe_response = 1;
    UnsubscribeResponse unsubscribe_response = 2;
  }
  Notification notification = 3;
}

message SubscribeRequest {
    int32 subscriber_id = 1;
    int32 subscribie_id = 2;
}

message UnsubscribeRequest {
    int32 subscriber_id = 1;
    int32 subscribie_id = 2;
}

message SubscribeResponse {
  string message = 1;
}

message UnsubscribeResponse {
  string message = 1;
}