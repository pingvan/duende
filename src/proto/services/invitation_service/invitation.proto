syntax = "proto3";

package invitation;

import "services/authservice/authservice.proto";

enum InviteStatus {
  SENDED = 0;
  ACCEPTED = 1;
  DECLINED = 2;
}

service InvitationService {
  rpc InvitationStream(stream StreamRequest) returns (stream StreamResponse) {}
}

service InvitionDataService {
  rpc GetReceivedInvitations(RequestWithId) returns (InvitesReceived) {}
  rpc GetSentInvitations(RequestWithId) returns (InvitesSent) {} 
}

message Invite {
  uint32 invite_id = 1;
  authservice.UserPreview sender = 2;
  string invite_text = 3;
  InviteStatus status = 4;
}

message InvitesReceived {
  repeated Invite invites = 1;
}

message InvitesSent {
  repeated Invite invites = 1;
}

message RequestWithId {
  int32 id = 1;
}

message Notification {
    int32 sender_id = 1;
    int32 receiver_id = 2;
    string message = 3;
}

message StreamRequest {
  oneof RequestEvent {
    SendInvitationRequest send_invitation_request = 1;
    RespondToInvitationRequest respond_to_invitation_request = 2;
  }
}

message StreamResponse {
  oneof ResponseEvent {
    SendInvitationResponse send_invitation_response = 1;
    RespondToInvitationResponse respond_to_invitation_response = 2;
  }
  Notification notification = 3;
}

message SendInvitationRequest {
  int32 sender_id = 1;
  int32 receiver_id = 2;
  string invite_text = 3;
  InviteStatus status = 4;

}

message RespondToInvitationRequest {
  uint32 invite_id = 1;
  int32 receiver_id = 2;
  bool accept = 3;
}

message SendInvitationResponse {
  string message = 1;
}

message RespondToInvitationResponse {
  string message = 1;
}
