syntax = "proto3";

package invitation;

import "common/common.proto"; 

enum InviteStatus {
  SENT = 0;
  ACCEPTED = 1;
  DECLINED = 2;
}

enum Status {
    SUCCESS = 0;
    ERROR = 1;
}

service InvitationService {
  rpc InvitationStream(stream InvitationRequest) returns (stream InvitationResponse) {}
}

service InvitationDataService {
  rpc GetReceivedInvitations(RequestWithId) returns (InvitesReceived) {}
  rpc GetSentInvitations(RequestWithId) returns (InvitesSent) {} 
}

message Invite {
  uint32 invite_id = 1;
  common.UserPreview sender = 2;
  string invite_text = 3;
  InviteStatus status = 4;
}

message InvitesReceived {
  repeated Invite invites = 1;
}

message InvitesSent {
  repeated Invite invites = 1;
}

message RequestWithId {
  int32 id = 1;
}

// message Notification {
//     int32 sender_id = 1;
//     int32 receiver_id = 2;
//     string message = 3;
// }

message InvitationRequest {
  oneof RequestEvent {
    SendInvitationRequest send_invitation_request = 1;
    RespondToInvitationRequest respond_to_invitation_request = 2;
    InitRequest init_request = 3;
    LeaveRequest leave_request = 4;
  }
}

message InvitationResponse {
  oneof ResponseEvent {
    SendInvitationResponse send_invitation_response = 1;
    RespondToInvitationResponse respond_to_invitation_response = 2;
    InitResponse init_response = 3;
    LeaveResponse leave_response = 4;
  }
  // Notification notification = 5;
}

message SendInvitationRequest {
  Invite invite = 1;
  int32 sender_id = 2;
  int32 receiver_id = 3;
}

message RespondToInvitationRequest {
  uint32 invite_id = 1;
  int32 sender_id = 2;
  int32 receiver_id = 3;
  InviteStatus status = 4;
}

message SendInvitationResponse {
  Invite invite = 1;
  int32 sender_id = 2;
  int32 receiver_id = 3;
}

message RespondToInvitationResponse {
  uint32 invite_id = 1;
  int32 sender_id = 2;
  int32 receiver_id = 3;
  InviteStatus status = 4;
}

message InitRequest {
  int32 user_id = 1;
}

message InitResponse {
  Status status = 1;
}

message LeaveRequest {
  int32 user_id = 1;
}

message LeaveResponse {
  Status status = 1;
}