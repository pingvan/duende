syntax = "proto3";

package block;

service BlockService {
  rpc Block(BlockRequest) returns (BlockResponse) {}
  rpc Unblock(UnblockRequest) returns (UnblockResponse) {}
  rpc ShowAllBlocked(ShowAllBlockedRequest) returns (ShowAllBlockedResponse) {}
}

message BlockRequest {
    int32 blocker_id = 1;
    int32 blockie_id = 2;
}

message UnblockRequest {
    int32 blocker_id = 1;
    int32 blockie_id = 2;
}

message ShowAllBlockedRequest {
    int32 blockie_id = 1;
}

message BlockResponse {
  string message = 1;
}

message UnblockResponse {
  string message = 1;
}

message ShowAllBlockedResponse {
    repeated int32 blockie_id = 1;
}